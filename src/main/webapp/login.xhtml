<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
	
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>#{appMB.readingClub} - #{appMB.login}</title>
	    <link rel="icon" type="image/x-icon" href="resources/favicon/comics.png"/>
	    <link rel="stylesheet" href="resources/css/login.css" />
	</h:head>
	
	<h:body>
		<div class="auth-container">
	    	<div class="auth-image">
	            <div class="logo-section">
	                <h1>#{appMB.readingClub}</h1>
	                <p>Organize e gerencie seus empréstimos de forma prática e inteligente</p>
	            </div>
	        </div>
	
	        <div class="auth-form">
	            <div class="form-wrapper">
	                <!-- PAINEL DE LOGIN -->
	                <div id="loginPanel" class="form-panel active">
	                    <div class="form-header">
	                        <h2>Bem-vindo!</h2>
	                        <p>Entre com suas credenciais para acessar</p>
	                    </div>
	
	                    <h:form id="loginForm">
	                    	<p:messages autoUpdate="true" showDetail="false" />
	                    	
	                        <div class="form-group">
	                            <p:outputLabel for="email" value="Email" />
		            			<p:inputText id="email" value="#{loginMB.email}" required="true" placeholder="user@readingclub.com" />
	                        </div>
	
	                        <div class="form-group">
	                            <p:outputLabel for="password" value="Senha" />
		            			<p:password id="password" value="#{loginMB.password}" toggleMask="true" required="true" />
	                        </div>
	
	                        <p:commandButton value="#{appMB.login}" action="#{loginMB.login}" ajax="false" icon="pi pi-sign-in" />
	                    </h:form>
	
	                    <div class="toggle-form">
	                        Não tem uma conta? <a href="javascript:void(0)" onclick="toggleForms()">Sign Up</a>
	                    </div>
	                </div>
	
	                <!-- PAINEL DE REGISTRO -->
	                <div id="registerPanel" class="form-panel">
	                    <div class="form-header">
	                        <h2>Criar Conta</h2>
	                        <p>Preencha os dados para se cadastrar</p>
	                    </div>
	
	                    <h:form id="registerForm">
	                    	<p:messages autoUpdate="true" showDetail="false" />
	                    	
	                        <div class="form-group">
	                            <p:outputLabel for="name" value="Nome" />
		            			<p:inputText id="name" value="#{userMB.user.name}" required="true" />
	                        </div>
	
	                        <div class="form-group">
	                            <p:outputLabel for="cpf" value="CPF" />
		            			<p:inputMask id="cpf" value="#{userMB.user.cpf}" mask="999.999.999-99" placeholder="111.111.111-11" required="true" validatorMessage="CPF inválido" />
	                        </div>
	
	                        <div class="form-group">
	                            <p:outputLabel for="email" value="Email" />
					            <p:inputText id="email" value="#{userMB.user.email}" placeholder="user@readingclub.com" required="true" validatorMessage="E-mail inválido">
				   					 <f:validateRegex  pattern="^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$" />
				        		</p:inputText>
	                        </div>
	
	                        <div class="form-group">
	                            <p:outputLabel for="phoneNumber" value="Telefone" />
		            			<p:inputMask id="phoneNumber" value="#{userMB.user.phoneNumber}" mask="(99) 99999-9999" placeholder="(32) 99999-9999" required="true" />
	                        </div>
	
	                        <div class="form-group">
	                            <p:outputLabel for="birthDate" value="Data de Nascimento" />
								<p:datePicker id="birthDate" value="#{userMB.user.birthDate}" pattern="dd/MM/yyyy" showIcon="true" required="true" maxdate="#{now}" />
	                        </div>
	                        
	                        <div class="form-group">
	                        	<p:outputLabel for="login" value="Login" />
		            			<p:inputText id="login" value="#{userMB.user.login}" required="true" />
	                        </div>
	                        
	                        <div class="form-group">
	                        	<p:outputLabel for="password" value="Senha" />
		            			<p:inputText id="password" value="#{userMB.user.password}" toggleMask="true" feedback="true" required="true" />
	                        </div>
	                        
	                        <p:commandButton value="#{appMB.addUsers}" action="#{userMB.insert}" ajax="false" />
	                    </h:form>
	
	                    <div class="toggle-form">
	                        Já tem uma conta? <a href="javascript:void(0)" onclick="toggleForms()">#{appMB.login}</a>
	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>
	    
		<h:outputScript library="js" name="#{appMB.loginJs}" target="body" />
	</h:body>
</html>
