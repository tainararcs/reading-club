<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

	<h:head>
	    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	    <title>Acesso Negado</title>
	    
	    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
	    
	    <!-- Favicon -->
	    <link rel="icon" type="image/x-icon" href="resources/favicon/comics.png"/>
	    
	    <style>
	        * {
	            margin: 0;
	            padding: 0;
	            box-sizing: border-box;
	        }
	
	        body {
	            font-family: 'Inter', sans-serif;
	            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
	            min-height: 100vh;
	            display: flex;
	            align-items: center;
	            justify-content: center;
	            padding: 20px;
	            position: relative;
	            overflow: hidden;
	        }
	
	        /* Animated Background Elements */
	        body::before {
	            content: '';
	            position: absolute;
	            width: 600px;
	            height: 600px;
	            background: rgba(255, 255, 255, 0.05);
	            border-radius: 50%;
	            top: -300px;
	            right: -300px;
	            animation: float 20s infinite ease-in-out;
	        }
	
	        body::after {
	            content: '';
	            position: absolute;
	            width: 500px;
	            height: 500px;
	            background: rgba(255, 255, 255, 0.05);
	            border-radius: 50%;
	            bottom: -250px;
	            left: -250px;
	            animation: float 15s infinite ease-in-out reverse;
	        }
	
	        @keyframes float {
	            0%, 100% {
	                transform: translate(0, 0) scale(1);
	            }
	            50% {
	                transform: translate(30px, 30px) scale(1.1);
	            }
	        }
	
	        /* Main Container */
	        .error-container {
	            background: white;
	            border-radius: 24px;
	            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
	            max-width: 700px;
	            width: 100%;
	            padding: 60px 50px;
	            text-align: center;
	            position: relative;
	            z-index: 1;
	            animation: slideUp 0.6s ease;
	        }
	
	        @keyframes slideUp {
	            from {
	                opacity: 0;
	                transform: translateY(30px);
	            }
	            to {
	                opacity: 1;
	                transform: translateY(0);
	            }
	        }
	
	        /* Icon Container */
	        .icon-container {
	            position: relative;
	            margin: 0 auto 30px;
	            width: 150px;
	            height: 150px;
	        }
	
	        .icon-circle {
	            width: 150px;
	            height: 150px;
	            background: linear-gradient(135deg, #fee2e2, #fecaca);
	            border-radius: 50%;
	            display: flex;
	            align-items: center;
	            justify-content: center;
	            position: relative;
	            animation: pulse 2s infinite;
	        }
	
	        @keyframes pulse {
	            0%, 100% {
	                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
	            }
	            50% {
	                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
	            }
	        }
	
	        .icon-circle i {
	            font-size: 70px;
	            color: #dc2626;
	        }
	
	        .shield-icon {
	            position: absolute;
	            top: -10px;
	            right: -10px;
	            width: 50px;
	            height: 50px;
	            background: linear-gradient(135deg, #10b981, #059669);
	            border-radius: 50%;
	            display: flex;
	            align-items: center;
	            justify-content: center;
	            color: white;
	            font-size: 24px;
	            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
	            border: 3px solid white;
	        }
	
	        /* Error Code */
	        .error-code {
	            font-family: 'Poppins', sans-serif;
	            font-size: 5em;
	            font-weight: 800;
	            background: linear-gradient(135deg, #dc2626, #ef4444);
	            -webkit-background-clip: text;
	            -webkit-text-fill-color: transparent;
	            background-clip: text;
	            margin-bottom: 10px;
	            line-height: 1;
	            letter-spacing: -3px;
	        }
	
	        /* Titles and Text */
	        .error-title {
	            font-family: 'Poppins', sans-serif;
	            font-size: 2.2em;
	            color: #047857;
	            margin-bottom: 15px;
	            font-weight: 700;
	        }
	
	        .error-message {
	            color: #6b7280;
	            font-size: 1.1em;
	            line-height: 1.6;
	            margin-bottom: 30px;
	            max-width: 500px;
	            margin-left: auto;
	            margin-right: auto;
	        }
	
	        /* Buttons */
	        .action-buttons {
	            display: flex;
	            gap: 15px;
	            justify-content: center;
	            flex-wrap: wrap;
	            margin-top: 35px;
	        }
	
	        .btn {
	            padding: 14px 32px;
	            border-radius: 12px;
	            font-size: 1em;
	            font-weight: 600;
	            font-family: 'Inter', sans-serif;
	            cursor: pointer;
	            transition: all 0.3s ease;
	            text-decoration: none;
	            display: inline-flex;
	            align-items: center;
	            gap: 10px;
	            border: none;
	        }
	
	        .btn-primary {
	            background: linear-gradient(135deg, #10b981, #059669);
	            color: white;
	            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
	        }
	
	        .btn-primary:hover {
	            transform: translateY(-2px);
	            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.4);
	        }
	
	        .btn i {
	            font-size: 1.2em;
	        }
	
	        /* Responsive */
	        @media (max-width: 768px) {
	            .error-container {
	                padding: 40px 30px;
	            }
	
	            .error-code {
	                font-size: 3.5em;
	            }
	
	            .error-title {
	                font-size: 1.8em;
	            }
	
	            .error-message {
	                font-size: 1em;
	            }
	
	            .icon-container {
	                width: 120px;
	                height: 120px;
	            }
	
	            .icon-circle {
	                width: 120px;
	                height: 120px;
	            }
	
	            .icon-circle i {
	                font-size: 55px;
	            }
	
	            .action-buttons {
	                flex-direction: column;
	            }
	
	            .btn {
	                width: 100%;
	                justify-content: center;
	            }
	        }
	    </style>
	</h:head>

	<h:body>
	    <div class="error-container">
	        <!-- Icon -->
	        <div class="icon-container">
	            <div class="icon-circle">
	                <i class="bi bi-shield-lock-fill"></i>
	            </div>
	            
	            <div class="shield-icon">
	                <i class="bi bi-exclamation-triangle-fill"></i>
	            </div>
	        </div>
	
	        <!-- Error Code -->
	        <div class="error-code">403</div>
	
	        <!-- Title -->
	        <h1 class="error-title">ERRO</h1>
	
	        <!-- Message -->
	        <p class="error-message">
	            Desculpe, você não possui permissão para acessar esta página ou ela não existe
	        </p>
	
	        <h:link outcome="home?faces-redirect=true" styleClass="btn btn-primary">
			    <i class="bi bi-house-door-fill"></i>
			    <span>Voltar ao Início</span>
			</h:link>
	    </div>
	</h:body>
</html>
