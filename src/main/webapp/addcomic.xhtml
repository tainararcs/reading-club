<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>Reading Club - Registrar Revista</title>
		
		<!-- BootStrap -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

		<!-- Favicon -->
	    <link rel="icon" type="image/x-icon" href="resources/favicon/comics.png"/>
	    
	    <!-- CSS --> 
	    <link rel="stylesheet" href="resources/css/form.css" />
	</h:head>
	
	<h:body>
		<ui:include src="menu.xhtml"/>
		<ui:include src="header.xhtml"/>
		
		<h:form>
        	<p:panel header="Registrar Revista">
        		<p:messages autoUpdate="true" showDetail="true" />
        		
				<p:outputLabel for="collection" value="Coleção" />
				<p:inputText id="collection" value="#{comicMB.comic.collection}" required="true" />
			            
			    <p:outputLabel for="editionNumber" value="Número da Edição" />
				<p:inputText id="editionNumber" value="#{comicMB.comic.editionNumber}" required="true" />
				
				<p:outputLabel for="year" value="Ano da revista" />
				<p:inputText id="year" value="#{comicMB.comic.year}" required="true" />
				
				<p:outputLabel for="boxId" value="Selecione a Caixa" />
				<p:selectOneMenu id="boxId" value="#{comicMB.comic.boxId}" required="true">
				    <f:selectItem itemLabel="Selecione..." itemValue="" />
				    <f:selectItems value="#{boxMB.boxesList}" var="b" itemLabel="#{b.color}" itemValue="#{b.id}" />
				</p:selectOneMenu>
				
				<p:commandButton value="Registrar Revista" action="#{comicMB.insert}" ajax="false" />
			</p:panel>
		</h:form>
	</h:body>
</html>
