<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>#{appMB.readingClub} - #{appMB.registerBox}</title>
		<!-- BootStrap -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
	    <link rel="icon" type="image/x-icon" href="resources/favicon/comics.png"/>
	    <link rel="stylesheet" href="resources/css/form.css" />
	</h:head>
	
	<h:body>
		<ui:include src="#{appMB.menuHtml}"/>
		<ui:include src="#{appMB.headerHtml}"/>
		
		<h:form>
        	<p:panel header="#{appMB.registerBox}">
        		<p:messages showDetail="true" />
        		
				<p:outputLabel for="number" value="Número da caixa" />
				<p:inputText id="number" value="#{boxMB.box.number}" required="true" />
			            
			    <p:outputLabel for="color" value="Cor da caixa" />
				<p:inputText id="color" value="#{boxMB.box.color}" required="true" />
				
				<p:commandButton value="#{appMB.registerBox}" action="#{boxMB.insert}" ajax="false" />
			</p:panel>
		</h:form>
	</h:body>
</html>
