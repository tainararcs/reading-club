<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
  	  xmlns:h="http://xmlns.jcp.org/jsf/html"
  	  xmlns:p="http://primefaces.org/ui"
  	  xmlns:f="http://xmlns.jcp.org/jsf/core"
  	  xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  	  
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>Reading Club - Registrar Empréstimo</title>
		
		<!-- BootStrap -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

		<!-- Favicon -->
	    <link rel="icon" type="image/x-icon" href="resources/favicon/comics.png"/>
	    
	    <!-- CSS --> 
	    <link rel="stylesheet" href="resources/css/form.css" />
	</h:head>
	
	<h:body>
		<ui:include src="menu.xhtml"/>
		<ui:include src="header.xhtml"/>
		
		<h:form>
        	<p:panel header="Registrar Empréstimo">
        		<p:messages showDetail="true" />
        		
				<p:outputLabel for="user" value="Usuário" />
				
				<!-- Admin -->
				<p:selectOneMenu id="userAdmin" value="#{borrowingMB.userCpf}" required="true" rendered="#{loginMB.admin}">
				    <f:selectItem itemLabel="Selecione..." itemValue="" />
				    <f:selectItems value="#{userMB.availablesList}" var="u" itemLabel="#{u.name}" itemValue="#{u.cpf}" />
				</p:selectOneMenu>
				
				<!-- User -->
				<p:inputText id="user" value="#{loginMB.loggedUser.name}"  readonly="true" rendered="#{loginMB.user}" />
				<h:inputHidden value="#{loginMB.loggedUser.cpf}" rendered="#{loginMB.user}" />
				
				<p:outputLabel for="comic" value="Revista" />				
				<p:selectOneMenu id="comic" value="#{borrowingMB.comicId}" required="true">
				    <f:selectItem itemLabel="Selecione..." itemValue="" />
				    <f:selectItems value="#{comicMB.availablesList}" var="c" itemLabel="#{c.collection}" itemValue="#{c.id}" />
				</p:selectOneMenu>


				<p:outputLabel for="checkoutDate" value="Data do Empréstimo" />
				<p:datePicker id="checkoutDate" required="true" readonly="true" value="#{borrowingMB.borrowing.checkoutDate}" />
				
				<p:outputLabel for="expectedReturnDate" value="Data para retorno" />
				<p:datePicker id="expectedReturnDate" required="true" readonly="true" value="#{borrowingMB.borrowing.expectedReturnDate}" />
				
				<p:commandButton value="Registrar Empréstimo" action="#{borrowingMB.insert}" ajax="false" />
			</p:panel>
		</h:form>
	</h:body>
</html>
