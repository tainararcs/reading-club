<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
	  
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	    <link rel="stylesheet" href="resources/css/menu.css" />
	</h:head>
	
	<h:body>
		<div class="sidebar">
			<h2>#{appMB.readingClub}</h2>
			
			<div class="sidebar-menu">
				<p:link outcome="home">
				   <i class="bi bi-house-door"></i> #{appMB.home}
				</p:link>
					
	            <!-- ADMIN -->
				<p:link outcome="adduser" rendered="#{loginMB.admin}">
					<i class="bi bi-person-square"></i> #{appMB.addUsers}
				</p:link>
		
				<p:link outcome="addcomic" rendered="#{loginMB.admin}">
				   <i class="bi bi-book-half"></i> #{appMB.addComics}
				</p:link>
				
				<p:link outcome="addbox" rendered="#{loginMB.admin}">
				   <i class="bi bi-box-fill"></i> #{appMB.addBoxes}
				</p:link>
				
				<p:link outcome="addborrowing" rendered="#{loginMB.admin}">
				   <i class="bi bi-cart-plus-fill"></i> #{appMB.addBorrowings}
				</p:link>
		
				<p:link outcome="showborrowings" rendered="#{loginMB.admin}">
				   <i class="bi bi-cart-check-fill"></i> #{appMB.borrowingsHistory}
				</p:link>
				
				<p:link outcome="showreport" rendered="#{loginMB.admin}">
				   <i class="bi bi-postcard-fill"></i> #{appMB.generateReport}
				</p:link>
				
				<!-- USER -->
				<p:link outcome="showcomics" rendered="#{loginMB.user}">
					<i class="bi bi-card-list"></i> #{appMB.listComics}
				</p:link>
				
				<p:link outcome="addborrowing" rendered="#{loginMB.user}">
				   <i class="bi bi-cart-plus-fill"></i> #{appMB.doBorrow}
				</p:link>
				
				<p:link outcome="showborrowings" rendered="#{loginMB.user}">
				   <i class="bi bi-cart-check-fill"></i> #{appMB.borrowingsHistory}
				</p:link>
			</div>
		</div>	
	</h:body>
</html>
