<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
  	  xmlns:h="http://xmlns.jcp.org/jsf/html"
  	  xmlns:p="http://primefaces.org/ui"
  	  xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
  	  
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>Reading Club - Empréstimos</title>
		<!-- BootStrap -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
	    <link rel="icon" type="image/x-icon" href="resources/favicon/comics.png"/>
	    <link rel="stylesheet" href="resources/css/form.css" />
	</h:head>
	
	<h:body>
	    <ui:include src="#{appMB.menuHtml}"/>
		<ui:include src="#{appMB.headerHtml}"/>
		
	    <h1>Empréstimos</h1>
	
	    <h:form>
	        <p:messages autoUpdate="true" showDetail="false" />
	        
			<p:panelGrid columns="2" rendered="#{loginMB.admin}" >
		        <p:inputText value="#{borrowingMB.userCpf}" placeholder="CPF do usuário" />
				<p:commandButton value="Filtrar" action="#{borrowingMB.filterByUser}" update="borrowsTable" />
		    </p:panelGrid>
				    
	        <p:dataTable id="borrowsTable" value="#{borrowingMB.borrowingsList}" var="b" paginator="true" rows="10" responsiveLayout="scroll">
				
	            <p:column headerText="ID">#{b.id}</p:column>
	
	            <p:column headerText="Usuário">#{b.user.name}</p:column>
	
	            <p:column headerText="Coleção">#{b.comic.collection}</p:column>
				
				<p:column headerText="Número da Edição">#{b.comic.editionNumber}</p:column>
				
	            <p:column headerText="Data Empréstimo">#{b.checkoutDate}</p:column>
	
	            <p:column headerText="Devolução">
	                <h:panelGroup rendered="#{b.returnDate == null}">
	                    <p:commandButton value="Registrar Devolução" icon="pi pi-check" update="@form" actionListener="#{borrowingMB.returnToday(b)}" ajax="true" rendered="#{loginMB.admin}" />
	                </h:panelGroup>
	
	                <h:panelGroup rendered="#{b.returnDate != null}">
						<p:button value="Disponível" icon="pi pi-check" disabled="true" rendered="#{loginMB.admin}" />
					</h:panelGroup>
					
					<h:panelGroup rendered="#{b.returnDate != null}">
						<p:button value="Devolvido em #{b.returnDate}" disabled="true" rendered="#{loginMB.user}" />
					</h:panelGroup>
	            </p:column>
	
	        </p:dataTable>
	    </h:form>
	</h:body>
</html>
